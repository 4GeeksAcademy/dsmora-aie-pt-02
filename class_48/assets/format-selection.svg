<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">Decision de formato de transporte</title>
  <desc id="description">Comparativa de JSON, CSV y YAML segun estructura, consumidor y uso.</desc>
  <rect width="1200" height="650" fill="#f7f7f2"/>
  <rect x="55" y="45" width="1090" height="92" rx="8" fill="#12343b"/>
  <text x="100" y="92" fill="#ffffff" font-family="Georgia, serif" font-size="37" font-weight="bold">Elegir el formato de transporte</text>
  <text x="100" y="119" fill="#b7d9cf" font-family="Arial, sans-serif" font-size="18">Primero describe el problema; despues elige el formato.</text>
  <text x="65" y="185" fill="#12343b" font-family="Arial, sans-serif" font-size="22" font-weight="bold">Cinco preguntas</text>
  <g fill="#ffffff" stroke="#c7d4ce" stroke-width="2"><rect x="65" y="210" width="200" height="135" rx="8"/><rect x="285" y="210" width="200" height="135" rx="8"/><rect x="505" y="210" width="200" height="135" rx="8"/><rect x="725" y="210" width="200" height="135" rx="8"/><rect x="945" y="210" width="200" height="135" rx="8"/></g>
  <g fill="#12343b" font-family="Arial, sans-serif" font-size="18" text-anchor="middle"><text x="165" y="252" font-weight="bold">Estructura</text><text x="165" y="282">Plana o</text><text x="165" y="307">anidada?</text><text x="385" y="252" font-weight="bold">Consumidor</text><text x="385" y="282">Maquina o</text><text x="385" y="307">persona?</text><text x="605" y="252" font-weight="bold">Comentarios</text><text x="605" y="282">Se necesitan</text><text x="605" y="307">comentarios?</text><text x="825" y="252" font-weight="bold">Volumen</text><text x="825" y="282">Cuanto dato</text><text x="825" y="307">viaja?</text><text x="1045" y="252" font-weight="bold">Sistemas</text><text x="1045" y="282">Quien lee y</text><text x="1045" y="307">escribe?</text></g>
  <g stroke="#dd6e42" stroke-width="3"><line x1="600" y1="372" x2="600" y2="408"/><path d="M590 396 L600 408 L610 396" fill="none"/></g>
  <g font-family="Arial, sans-serif"><rect x="65" y="435" width="330" height="150" rx="8" fill="#1d5b79"/><text x="92" y="475" fill="#ffffff" font-size="28" font-weight="bold">JSON</text><text x="92" y="508" fill="#d9edf6" font-size="18">Datos anidados entre maquinas</text><text x="92" y="537" fill="#d9edf6" font-size="18">APIs y mensajes entre servicios</text><rect x="435" y="435" width="330" height="150" rx="8" fill="#b85c38"/><text x="462" y="475" fill="#ffffff" font-size="28" font-weight="bold">CSV</text><text x="462" y="508" fill="#fff0e9" font-size="18">Datos planos y tabulares</text><text x="462" y="537" fill="#fff0e9" font-size="18">Exportaciones de gran volumen</text><rect x="805" y="435" width="330" height="150" rx="8" fill="#6d7d36"/><text x="832" y="475" fill="#ffffff" font-size="28" font-weight="bold">YAML</text><text x="832" y="508" fill="#f0f5db" font-size="18">Configuracion mantenida por personas</text><text x="832" y="537" fill="#f0f5db" font-size="18">Legibilidad y comentarios</text></g>
</svg>

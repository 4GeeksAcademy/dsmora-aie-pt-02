<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Flujo ETL para reporte de negocio</title>
  <desc id="description">La telemetria se extrae, transforma y carga en una tabla de reporting que alimenta endpoints de negocio.</desc>
  <rect width="1200" height="560" fill="#f7f7f2"/><rect x="55" y="45" width="1090" height="92" rx="8" fill="#12343b"/>
  <text x="100" y="92" fill="#ffffff" font-family="Georgia, serif" font-size="37" font-weight="bold">Del evento al KPI de negocio</text><text x="100" y="119" fill="#b7d9cf" font-family="Arial, sans-serif" font-size="18">ETL separa responsabilidades y conserva el reporte tecnico existente.</text>
  <g stroke="#dd6e42" stroke-width="5" fill="none"><path d="M260 300 H325"/><path d="M535 300 H600"/><path d="M810 300 H875"/></g><g fill="#dd6e42"><path d="M315 289 L330 300 L315 311"/><path d="M590 289 L605 300 L590 311"/><path d="M865 289 L880 300 L865 311"/></g>
  <g font-family="Arial, sans-serif" text-anchor="middle"><rect x="55" y="215" width="205" height="170" rx="8" fill="#1d5b79"/><text x="157" y="268" fill="#ffffff" font-size="24" font-weight="bold">Fuente</text><text x="157" y="305" fill="#d9edf6" font-size="17">telemetry_events</text><text x="157" y="334" fill="#d9edf6" font-size="17">y datos de dominio</text><rect x="330" y="215" width="205" height="170" rx="8" fill="#356859"/><text x="432" y="268" fill="#ffffff" font-size="24" font-weight="bold">Extraer</text><text x="432" y="305" fill="#dcf2e7" font-size="17">Datos en bruto</text><text x="432" y="334" fill="#dcf2e7" font-size="17">sin modificar</text><rect x="605" y="215" width="205" height="170" rx="8" fill="#b85c38"/><text x="707" y="268" fill="#ffffff" font-size="24" font-weight="bold">Transformar</text><text x="707" y="305" fill="#fff0e9" font-size="17">Metricas y KPIs</text><text x="707" y="334" fill="#fff0e9" font-size="17">del CONTEXT</text><rect x="880" y="215" width="205" height="170" rx="8" fill="#6d7d36"/><text x="982" y="268" fill="#ffffff" font-size="24" font-weight="bold">Cargar</text><text x="982" y="305" fill="#f0f5db" font-size="17">reporting.tabla</text><text x="982" y="334" fill="#f0f5db" font-size="17">destino exacta</text></g>
  <text x="600" y="455" fill="#12343b" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold">services/reporting</text><text x="600" y="490" fill="#51635e" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">Estado del pipeline  |  Disparo manual  |  Consulta de KPIs</text>
</svg>

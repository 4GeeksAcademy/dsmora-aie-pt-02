<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title description">
  <title id="title">Idempotencia en un pipeline</title>
  <desc id="description">Dos ejecuciones con los mismos eventos producen una unica salida consistente gracias a deduplicacion y upsert.</desc>
  <rect width="1200" height="570" fill="#f7f7f2"/><rect x="55" y="45" width="1090" height="92" rx="8" fill="#12343b"/>
  <text x="100" y="92" fill="#ffffff" font-family="Georgia, serif" font-size="37" font-weight="bold">Idempotencia: repetir sin duplicar</text><text x="100" y="119" fill="#b7d9cf" font-family="Arial, sans-serif" font-size="18">La segunda corrida deja el mismo resultado que una corrida limpia.</text>
  <g font-family="Arial, sans-serif" text-anchor="middle"><rect x="70" y="205" width="260" height="130" rx="8" fill="#1d5b79"/><text x="200" y="253" fill="#ffffff" font-size="24" font-weight="bold">Eventos fuente</text><text x="200" y="286" fill="#d9edf6" font-size="18">eventId unico</text><rect x="470" y="205" width="260" height="130" rx="8" fill="#b85c38"/><text x="600" y="253" fill="#ffffff" font-size="24" font-weight="bold">Regla de carga</text><text x="600" y="286" fill="#fff0e9" font-size="18">upsert por particion</text><rect x="870" y="205" width="260" height="130" rx="8" fill="#6d7d36"/><text x="1000" y="253" fill="#ffffff" font-size="24" font-weight="bold">Salida estable</text><text x="1000" y="286" fill="#f0f5db" font-size="18">sin filas duplicadas</text></g>
  <g stroke="#dd6e42" stroke-width="5" fill="none"><path d="M330 270 H455"/><path d="M730 270 H855"/></g><g fill="#dd6e42"><path d="M445 259 L460 270 L445 281"/><path d="M845 259 L860 270 L845 281"/></g>
  <g font-family="Arial, sans-serif"><rect x="145" y="410" width="910" height="90" rx="8" fill="#ffffff" stroke="#c7d4ce" stroke-width="2"/><text x="190" y="448" fill="#12343b" font-size="21" font-weight="bold">Corrida 1:</text><text x="320" y="448" fill="#51635e" font-size="21">carga parcial y fallo</text><text x="620" y="448" fill="#12343b" font-size="21" font-weight="bold">Corrida 2:</text><text x="750" y="448" fill="#51635e" font-size="21">reintento, mismo resultado correcto</text><text x="600" y="482" fill="#51635e" font-size="17" text-anchor="middle">Registrar run_id, estado, registros procesados, errores y checkpoint permite auditar y retomar.</text></g>
</svg>
